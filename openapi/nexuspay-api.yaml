openapi: 3.1.0
info:
  title: NexusPay AI — PayPal Agentic Commerce & Zero-Knowledge Escrow API
  version: 2.0.0
  summary: Autonomous Agentic Commerce, Confidential Zero-Knowledge NDA Verification & Milestone Escrow Powered by PayPal
  description: |
    ### NexusPay AI — Autonomous Agentic Commerce & Confidential Milestone Escrow Protocol
    **Official Submission for the PayPal AI Hackathon 2026**  
    **Author**: Aristide Bienvenu EMCTHEU (`@arispacco`)  
    **License**: MIT License  

    NexusPay AI empowers autonomous AI buyer and seller agents (*Atlas* and *Nova*) to negotiate smart commercial agreements, lock escrow funds via PayPal Orders v2, verify technical deliverables through confidential Zero-Knowledge proofs or ephemeral RAM DLP inspection, and autonomously disburse payouts or arbitrate disputes.

    #### Key Architectural Capabilities:
    1. **Official `@paypal/agent-toolkit` MCP Server**: Exposes 10 official PayPal MCP tools (`create_order`, `pay_order`, `create_invoice`, `list_invoices`, `send_invoice`, `list_disputes`, `get_dispute`, etc.) with live telemetry.
    2. **Dual-Track Confidentiality**:
       - *Mode A: Ephemeral RAM DLP Shield & ZDR*: Redacts API secrets, PayPal tokens, GitHub PATs, and PII in `<1ms` RAM before LLM inspection.
       - *Mode B: Strict NDA Zero-Knowledge Attestation*: 0% source code transmitted; HMAC-SHA256 signed test attestations verify deliverables without proprietary leak.
    3. **Two-Step Milestone Escrow**: Supports `intent: 'AUTHORIZE'` and `intent: 'CAPTURE'` with granular milestone releases.
    4. **Inbound PayPal Webhooks**: Cryptographic signature validation with event idempotency.
    5. **AI Arbitration Tribunal**: Autonomous dispute settlement with 1-click PayPal split refunds.
  contact:
    name: Aristide Bienvenu EMCTHEU
    url: https://github.com/arispacco/nexuspay-ai
    email: 207110828+arispacco@users.noreply.github.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Local Development & Judge Sandbox Server
  - url: https://nexuspay-ai.onrender.com
    description: Production Render Web Service

tags:
  - name: System & Health
    description: Service health readiness probes and system capability metadata
  - name: PayPal MCP Toolkit
    description: Official @paypal/agent-toolkit MCP tool discovery and live execution telemetry
  - name: Agent Negotiation & KYA
    description: Multi-agent negotiation, KYA cryptographic passports, and contract persistence
  - name: PayPal Escrow Lifecycle
    description: Orders v2 escrow deposit, two-step authorization, invoice creation, captures, and refunds
  - name: Privacy & Zero-Knowledge
    description: Ephemeral RAM DLP secret redaction, ZDR certificates, and local ZK attestation verification
  - name: AI Dispute Arbitration
    description: Autonomous contract dispute arbitration, evidence analysis, and split refunds
  - name: Financial & Webhook Ledger
    description: AG Grid persistent transaction records, milestone disbursements, and inbound webhook processing

paths:
  /api/health:
    get:
      tags:
        - System & Health
      summary: Health check & MCP engine status
      description: Returns service health, runtime version, and registered PayPal Agent Toolkit MCP tools.
      operationId: getHealthStatus
      responses:
        '200':
          description: Service is healthy and PayPal MCP toolkit is initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Standard healthy probe
                  value:
                    status: healthy
                    timestamp: "2026-11-09T10:00:00.000Z"
                    service: "NexusPay AI Agentic Escrow Protocol"
                    version: "2.0.0"
                    paypalMcpSdk: "@paypal/agent-toolkit/mcp"
                    registeredMcpTools:
                      - create_order
                      - pay_order
                      - create_invoice
                      - list_invoices
                      - send_invoice
                      - list_disputes
                      - get_dispute

  /api/paypal/mcp-tools:
    get:
      tags:
        - PayPal MCP Toolkit
      summary: PayPal MCP capabilities & execution telemetry
      description: Returns all registered @paypal/agent-toolkit MCP tools and real-time execution telemetry buffer.
      operationId: getPayPalMcpTools
      responses:
        '200':
          description: List of MCP tools and telemetry ring buffer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpCapabilitiesResponse'

  /api/negotiate:
    post:
      tags:
        - Agent Negotiation & KYA
      summary: Autonomous Agent-to-Agent KYA negotiation
      description: Initiates RFP mandate negotiation between Buyer Agent *Atlas* and Seller Agent *Nova*, producing a co-signed Smart Milestone Agreement with KYA Passports.
      operationId: runNegotiation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NegotiateRequest'
            examples:
              checkoutService:
                summary: Autonomous Checkout Microservice
                value:
                  projectTitle: "Autonomous Checkout Microservice"
                  projectScope: "React + PayPal Orders v2 + Webhook verification"
                  initialBudget: 350
                  freelancerSkills: "React, Node.js, PayPal SDK"
                  ndaRequired: true
      responses:
        '200':
          description: Co-signed Smart Milestone Agreement and full multi-agent transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NegotiateResponse'
        '500':
          description: Agent negotiation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/paypal/create-order:
    post:
      tags:
        - PayPal Escrow Lifecycle
      summary: Create PayPal Escrow Order (Deposit / Two-Step Auth)
      description: "Creates a PayPal Orders v2 order locking funds in escrow (intent: 'CAPTURE' or two-step intent: 'AUTHORIZE'). Automatically logs transaction to AG Grid ledger."
      operationId: createPayPalOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              escrowDeposit:
                summary: Standard $350 Escrow Hold
                value:
                  amount: 350
                  currency: "USD"
                  description: "NexusPay Milestone Escrow"
                  customId: "SMA-DEMO-01"
                  intent: "CAPTURE"
                  privacyMode: "ZK-NDA"
      responses:
        '200':
          description: PayPal Order created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '500':
          description: Order creation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/paypal/create-invoice:
    post:
      tags:
        - PayPal Escrow Lifecycle
      summary: Generate PayPal Smart Milestone Invoice
      description: Issues a formal PayPal Invoicing v2 draft itemizing contract milestones with automated payment links.
      operationId: createPayPalInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
            examples:
              milestoneInvoice:
                summary: Itemized Milestone Invoice
                value:
                  agreement:
                    id: "SMA-DEMO-01"
                    totalBudget: 350
                    currency: "USD"
                    milestones:
                      - name: "Core Architecture & Webhooks"
                        amount: 150
                      - name: "Frontend AG Grid & PayPal React Checkout"
                        amount: 200
                  recipientEmail: "freelancer-sandbox@business.example.com"
      responses:
        '200':
          description: PayPal Invoice created and logged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvoiceResponse'
        '500':
          description: Invoice generation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/paypal/capture-order:
    post:
      tags:
        - PayPal Escrow Lifecycle
      summary: Capture PayPal Escrow Order (Milestone Auto-Release)
      description: Captures locked PayPal funds upon successful deliverable audit or verified Zero-Knowledge attestation. Updates persistent ledger and milestone state.
      operationId: capturePayPalOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureOrderRequest'
            examples:
              autoRelease:
                summary: Instant Auto-Release on 95% AI Score
                value:
                  orderId: "8XP1298491823"
                  agreementId: "SMA-DEMO-01"
                  score: 95
                  privacyMode: "ZK-NDA"
                  proofHash: "sha256:7f83b1657ff1fc53b92dc18148a1d65dfc2d4b1fa3d677284addd200126d9069"
      responses:
        '200':
          description: PayPal Order captured and disbursement completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureOrderResponse'
        '500':
          description: Order capture failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/paypal/refund-order:
    post:
      tags:
        - PayPal Escrow Lifecycle
      summary: Refund PayPal Order / Arbitrated Dispute Settlement
      description: Issues a full or partial PayPal capture refund resolving contested contract scope based on AI Arbitration Tribunal rulings.
      operationId: refundPayPalOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundOrderRequest'
            examples:
              partialRefund:
                summary: 75/25 Split Settlement Refund
                value:
                  captureId: "CAP-9821728192"
                  amount: 125
                  reason: "AI Arbitration Tribunal Settlement Ruling (75/25 Buyer Favor)"
                  agreementId: "SMA-3204"
      responses:
        '200':
          description: Refund processed and ledger updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundOrderResponse'
        '500':
          description: Refund failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/verify-deliverable:
    post:
      tags:
        - Privacy & Zero-Knowledge
      summary: Verify Deliverable with Ephemeral RAM DLP & AI Engine
      description: Scrubs sensitive secrets and PII in volatile RAM (<1ms) before running deterministic static AST inspection or live Gemini 2.5 Flash evaluation.
      operationId: verifyDeliverable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyDeliverableRequest'
            examples:
              codeDeliverable:
                summary: Production React + PayPal Hook
                value:
                  milestone: "M1: PayPal Checkout Integration"
                  deliverableType: "code"
                  deliverableContent: "import React from 'react'; export function Checkout() { return <div id='paypal-button-container'></div>; }"
                  repoUrl: "https://github.com/arispacco/nexuspay-ai"
      responses:
        '200':
          description: Deliverable compliance evaluation and criteria breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyDeliverableResponse'
        '500':
          description: Deliverable evaluation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/privacy/sanitize:
    post:
      tags:
        - Privacy & Zero-Knowledge
      summary: Live Ephemeral RAM DLP Sanitization Preview
      description: Previews real-time RAM secret masking for API tokens, PayPal secrets, JWTs, emails, and internal IPs with cryptographic Zero-Data-Retention (ZDR) certificate.
      operationId: sanitizeDeliverable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlpSanitizeRequest'
            examples:
              secretInspection:
                summary: Masking sk_test and PayPal credentials
                value:
                  content: "const KEY = 'sk_test_999888777666'; const PP_SECRET = 'EA12345678901234567890123456';"
      responses:
        '200':
          description: Masked content with redaction count and ZDR certificate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlpSanitizeResponse'

  /api/privacy/generate-zk-proof:
    post:
      tags:
        - Privacy & Zero-Knowledge
      summary: Generate Zero-Knowledge Attestation Proof (Private CI)
      description: Simulates private workstation/CI runner generating an HMAC-SHA256 signed test attestation bundle. Zero lines of proprietary source code leave the client environment.
      operationId: generateZkProof
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateZkProofRequest'
            examples:
              privateAttestation:
                summary: 100% Passing Private CI Bundle
                value:
                  agreementId: "SMA-NDA-600"
                  milestoneId: "M1"
                  testSuiteSummary:
                    totalTests: 24
                    passedTests: 24
                    coveragePercent: 96
                    buildPassed: true
                    lintErrors: 0
                  ndaDomain: "enterprise-private-ci.local"
      responses:
        '200':
          description: Cryptographic Zero-Knowledge Attestation Bundle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZkAttestationBundle'

  /api/privacy/verify-zk-proof:
    post:
      tags:
        - Privacy & Zero-Knowledge
      summary: Verify Zero-Knowledge Attestation Proof (Zero Code Exposed)
      description: Validates HMAC-SHA256 signature in constant time (`crypto.timingSafeEqual`). Blocks tampered proofs and authorizes autonomous PayPal escrow unlock.
      operationId: verifyZkProof
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyZkProofRequest'
      responses:
        '200':
          description: ZK verification outcome, scoring breakdown, and payout verdict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyZkProofResponse'

  /api/privacy/attestation/{id}:
    get:
      tags:
        - Privacy & Zero-Knowledge
      summary: Retrieve Persisted ZK Attestation Certificate
      description: Fetches a stored Zero-Knowledge cryptographic audit certificate by attestation ID.
      operationId: getZkAttestationById
      parameters:
        - name: id
          in: path
          required: true
          description: Unique Attestation ID (e.g. ZKA-9F28A1C4)
          schema:
            type: string
            example: "ZKA-9F28A1C4"
      responses:
        '200':
          description: Persisted ZK certificate found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZkAttestationRecord'
        '404':
          description: Attestation not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/arbitrate-dispute:
    post:
      tags:
        - AI Dispute Arbitration
      summary: Convene AI Dispute Arbitration Tribunal
      description: Multi-agent dispute arbitration assessing buyer and freelancer claims against the signed contract specifications. Yields split refund recommendation.
      operationId: arbitrateDispute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArbitrateDisputeRequest'
            examples:
              scopeDispute:
                summary: Contested Mobile Responsive Breakpoints
                value:
                  contract:
                    id: "SMA-3204"
                    title: "Fintech Mobile Checkout Microservice"
                    totalBudget: 500
                  disputeReason: "Secondary tablet responsiveness disputed"
                  clientClaim: "Tablet layout overflows on iPad Mini viewport."
                  freelancerClaim: "Core mobile and desktop layouts 100% delivered with approved PayPal Smart Buttons."
      responses:
        '200':
          description: Arbitration ruling with percentage split and settlement plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArbitrateDisputeResponse'
        '500':
          description: Arbitration failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/transactions:
    get:
      tags:
        - Financial & Webhook Ledger
      summary: Get Financial Escrow Ledger (AG Grid data source)
      description: Fetches all transactions from persistent SQLite store formatted for AG Grid v33 display.
      operationId: getLedgerTransactions
      responses:
        '200':
          description: Complete list of ledger transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsResponse'

  /api/agreements:
    get:
      tags:
        - Agent Negotiation & KYA
      summary: List all persistent Smart Milestone Agreements
      description: Returns all agreements stored in the SQLite database with milestone statuses.
      operationId: listAgreements
      responses:
        '200':
          description: List of stored agreements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreementsResponse'

  /api/agreements/{id}:
    get:
      tags:
        - Agent Negotiation & KYA
      summary: Fetch Smart Milestone Agreement by ID
      description: Retrieves a specific smart commercial agreement including its milestones, KYA mandates, and escrow status.
      operationId: getAgreementById
      parameters:
        - name: id
          in: path
          required: true
          description: Agreement ID (e.g. SMA-DEMO-01)
          schema:
            type: string
            example: "SMA-DEMO-01"
      responses:
        '200':
          description: Agreement details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
        '404':
          description: Agreement not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/agreements/{id}/milestones/{mId}/release:
    post:
      tags:
        - Financial & Webhook Ledger
      summary: Granular Milestone Payout Release
      description: Captures locked funds for a specific individual milestone within an agreement.
      operationId: releaseMilestonePayout
      parameters:
        - name: id
          in: path
          required: true
          description: Agreement ID
          schema:
            type: string
            example: "SMA-DEMO-01"
        - name: mId
          in: path
          required: true
          description: Milestone ID (e.g. M1)
          schema:
            type: string
            example: "M1"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneReleaseRequest'
      responses:
        '200':
          description: Milestone funds released successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneReleaseResponse'
        '404':
          description: Agreement or milestone not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Payout release error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/paypal/webhook:
    post:
      tags:
        - Financial & Webhook Ledger
      summary: Inbound PayPal Webhook Gateway
      description: Ingests inbound PayPal webhook events (`CHECKOUT.ORDER.APPROVED`, `PAYMENT.CAPTURE.COMPLETED`, `PAYMENT.CAPTURE.REFUNDED`, `CUSTOMER.DISPUTE.CREATED`). Validates PayPal headers and ensures event idempotency.
      operationId: handlePayPalWebhook
      parameters:
        - name: paypal-auth-algo
          in: header
          required: true
          description: PayPal signature algorithm (e.g. SHA256withRSA)
          schema:
            type: string
            example: "SHA256withRSA"
        - name: paypal-transmission-id
          in: header
          required: true
          description: Unique transmission UUID
          schema:
            type: string
            example: "c46327b0-8a8f-11eb-98d0-03ec7b7ef66b"
        - name: paypal-cert-url
          in: header
          required: true
          description: URL pointing to PayPal trusted cert
          schema:
            type: string
            example: "https://api-m.sandbox.paypal.com/v1/notifications/certs/CERT-360caa42-fca2b592-72c050a4"
        - name: paypal-transmission-sig
          in: header
          required: true
          description: Base64 transmission signature
          schema:
            type: string
            example: "iXwVj...base64Signature=="
        - name: paypal-transmission-time
          in: header
          required: true
          description: Transmission timestamp (ISO 8601)
          schema:
            type: string
            example: "2026-11-09T10:15:00Z"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayPalWebhookEvent'
      responses:
        '200':
          description: Webhook processed or recognized as duplicate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPalWebhookResponse'
        '400':
          description: Missing required PayPal webhook headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Webhook signature verification failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Webhook processing error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/webhooks/zapier:
    post:
      tags:
        - Financial & Webhook Ledger
      summary: Zapier Webhook Bridge
      description: Outbound webhook dispatcher forwarding escrow deposits, auto-releases, and dispute resolutions to external Zapier triggers.
      operationId: forwardZapierWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZapierWebhookRequest'
      responses:
        '200':
          description: Event dispatched to Zapier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZapierWebhookResponse'

  /api/webhooks/events:
    get:
      tags:
        - Financial & Webhook Ledger
      summary: View logged webhook audit events
      description: Queries idempotently recorded webhook events for auditing.
      operationId: getWebhookEvents
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of events to return (default 50)
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Logged webhook events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEventsResponse'

  /api/paypal/client-token:
    get:
      tags:
        - PayPal Escrow Lifecycle
      summary: Generate PayPal Client Token
      description: Generates an ephemeral SDK client token for `@paypal/react-paypal-js` Smart Buttons rendering.
      operationId: getPayPalClientToken
      responses:
        '200':
          description: Ephemeral client token generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientTokenResponse'

  /api/validate-paypal:
    post:
      tags:
        - PayPal Escrow Lifecycle
      summary: Validate PayPal Sandbox Credentials
      description: Validates client ID and client secret against PayPal Sandbox OAuth2 endpoint.
      operationId: validatePayPalCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidatePayPalRequest'
      responses:
        '200':
          description: Credential validation response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatePayPalResponse'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - service
        - version
        - paypalMcpSdk
        - registeredMcpTools
      properties:
        status:
          type: string
          example: healthy
        timestamp:
          type: string
          format: date-time
          example: "2026-11-09T10:00:00.000Z"
        service:
          type: string
          example: "NexusPay AI Agentic Escrow Protocol"
        version:
          type: string
          example: "2.0.0"
        paypalMcpSdk:
          type: string
          example: "@paypal/agent-toolkit/mcp"
        registeredMcpTools:
          type: array
          items:
            type: string
          example: ["create_order", "pay_order", "create_invoice", "list_invoices", "send_invoice", "list_disputes", "get_dispute"]

    McpCapabilitiesResponse:
      type: object
      properties:
        sdkPackage:
          type: string
          example: "@paypal/agent-toolkit/mcp"
        sdkVersion:
          type: string
          example: "1.11.0"
        sandbox:
          type: boolean
          example: true
        registeredTools:
          type: array
          items:
            type: string
          example: ["create_order", "pay_order", "create_invoice", "list_invoices", "send_invoice", "list_disputes", "get_dispute"]
        telemetryCount:
          type: integer
          example: 12
        telemetry:
          type: array
          items:
            $ref: '#/components/schemas/McpTelemetryEntry'

    McpTelemetryEntry:
      type: object
      properties:
        id:
          type: string
          example: "MCP-82194-491"
        timestamp:
          type: string
          format: date-time
        tool:
          type: string
          example: "create_order"
        endpoint:
          type: string
          example: "/v2/checkout/orders"
        method:
          type: string
          example: "POST"
        status:
          type: integer
          example: 201
        mode:
          type: string
          example: "sandbox_emulator"
        latencyMs:
          type: number
          example: 24
        summary:
          type: string
          example: "Locked $350.00 USD in PayPal Escrow (8XP928172)"
        payloadPreview:
          type: object

    NegotiateRequest:
      type: object
      required:
        - projectTitle
        - projectScope
        - initialBudget
      properties:
        projectTitle:
          type: string
          example: "Autonomous Checkout Microservice"
        projectScope:
          type: string
          example: "React + PayPal Orders v2 + Webhook verification"
        initialBudget:
          type: number
          example: 350
        freelancerSkills:
          type: string
          example: "React, Node.js, PayPal SDK"
        ndaRequired:
          type: boolean
          default: true
        geminiApiKey:
