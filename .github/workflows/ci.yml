name: NexusPay AI CI & Security Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run PayPal MCP, DLP & Zero-Knowledge Test Suite
        run: npm test

      - name: Run Local Confidential NDA Attestation CLI
        run: npm run attest

      - name: Build Production Bundle
        run: npm run build
